name: Security

# Run when the dependency graph changes and once a week, so a newly published
# advisory is reported even if the lockfile is untouched.
on:
  push:
    paths:
      - "Cargo.lock"
  pull_request:
    paths:
      - "Cargo.lock"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit
