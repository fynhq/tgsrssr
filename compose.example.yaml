## tgsrssr compose 模板（所有可选项均按代码默认值）。
## tgsrssr compose template (all optional values match code defaults).
##
## 新部署参考：复制为 compose.yaml，填入 TELOXIDE_TOKEN / ADMIN_USER_IDS，
## 按需取消注释调优项。除必填项外，全部注释项均与代码默认值一致，不设置时行为完全相同。
## For new deployments: copy to compose.yaml, fill in TELOXIDE_TOKEN / ADMIN_USER_IDS,
## and uncomment tuning options as needed. All commented values match code defaults —
## leaving them unset behaves identically.
##
## 注释约定：## 为说明文字；# 开头且形如 KEY: value 的行是可取消注释的可选参数。
## Comment convention: ## lines are documentation; lines starting with # followed by
## KEY: value are optional parameters you can uncomment.
##
## 注意：本模板为 Linux / WSL2 host 网络形态。network_mode: host 仅在 Linux
## 原生 Docker 下生效；macOS / Windows Docker Desktop 需改用 bridge 网络并相应调整代理与卷挂载配置。
## Note: this template uses Linux / WSL2 host networking. network_mode: host only works
## on native Linux Docker; macOS / Windows Docker Desktop requires bridge networking
## with adjusted proxy and volume settings.
services:
  tgsrssr:
    ## 默认拉取预构建镜像（无需本地编译）。如需从源码构建，注释 image 行并取消注释 build 行。
    ## Pulls a prebuilt image by default (no local compilation). To build from source,
    ## comment out the image line and uncomment the build line.
    image: ghcr.io/fynhq/tgsrssr:latest
    # build: .
    container_name: tgsrssr
    restart: unless-stopped
    network_mode: host
    environment:
      ## ===== 必填 / Required =====

      ## BotFather token
      TELOXIDE_TOKEN: "123456789:ABCdefGHIjklMNOpqrSTUvwxYZ"

      ## 管理员：必须配置，且只能一个正整数用户 ID；可用 /cookies、/loget，接收平台告警。
      ## 配置 0 个、多个或非正数将在启动时直接报错退出。
      ## Admin: required, exactly one positive user ID; can use /cookies & /loget,
      ## receives platform alerts. Setting zero, multiple, or non-positive IDs
      ## makes startup fail with an error.
      ADMIN_USER_IDS: "123456789"

      ## ===== 访问控制 / Access control =====

      ## 用户白名单（逗号分隔，可选）；默认为空。可配置多个用户 ID。
      ## 管理员隐式放行，无需重复列入——留空此项即可正常单人（仅管理员）使用。
      ## User whitelist (comma-separated, optional); empty by default, may list
      ## multiple IDs. The admin is implicitly allowed and need not be listed —
      ## leaving this empty works fine for admin-only use.
      # ALLOWED_USER_IDS: "123456789,987654321"

      ## ===== 平台/网络拓扑（按部署环境调整）/ Platform & network topology =====

      ## bot-api 容器内的共享媒体目录（富消息附件 file:// 直读；非空 +
      ## BOT_API_URL 启用 2GB 上限）。默认即此值，仅当本地 bot-api 部署使用了
      ## 不同的容器内路径时才需取消注释并修改。
      ## Shared media directory inside the bot-api container (rich-message file://
      ## attachments; non-empty + BOT_API_URL enables the 2GB cap). This is the
      ## default; uncomment only if your local bot-api uses a different in-container
      ## path.
      # BOT_API_MEDIA_DIR: "/var/lib/telegram-bot-api-media"

      ## 默认空=官方 API；本地 bot-api 时设置，此时 BOT_PROXY 被忽略
      ## Empty = official API; set for a local bot-api, which makes BOT_PROXY ignored
      # BOT_API_URL: "http://127.0.0.1:8081"

      ## Bot API 代理（http:// / socks5:// / socks5h://）；默认空=直连。
      ## 仅 BOT_API_URL 为空时生效；RSS/平台/媒体仍走 RSS_PROXY。
      ## Bot API proxy (http:// / socks5:// / socks5h://); empty = direct.
      ## Only used when BOT_API_URL is empty; RSS/platform/media keep using RSS_PROXY.
      # BOT_PROXY: "socks5h://127.0.0.1:1080"

      ## 默认空=直连
      ## Empty = direct connection
      # RSS_PROXY: "socks5h://127.0.0.1:1080"

      ## 默认空；直连白名单
      ## Empty; direct-connect whitelist
      # RSS_NO_PROXY: "localhost,127.0.0.1,.local"

      ## 默认空；跳过 TLS 校验的主机
      ## Empty; hosts skipping TLS verification
      # RSS_INSECURE_HOSTS: ""

      ## 受信私网源 allowlist（精确 host:port，逗号分隔）。仅管理员/受信用户可用，
      ## 不是通用私网白名单；默认空 = 不启用。
      ## Trusted private-source allowlist (exact host:port, comma-separated).
      ## Admin/trusted users only; NOT a general private-network allowlist.
      ## Empty = disabled.
      # RSS_TRUSTED_PRIVATE_HOSTS: "rsshub:1200"

      ## 默认 admin=仅管理员；allowed=管理员+白名单
      ## Default admin = admin only; allowed = admin + whitelist
      # RSS_TRUSTED_PRIVATE_SCOPE: "admin"

      ## ===== 媒体 / Media =====

      ## 默认 100；单文件媒体下载上限（图片/视频/文档/音频统一），超限不下载，
      ## 视频超限降级纯文本并通知
      ## Default 100; per-file media download limit (photos/videos/documents/audio);
      ## oversized media is skipped, oversized videos fall back to text with a notice
      # MAX_MEDIA_DOWNLOAD_MB: "100"

      ## 默认 true；媒体超过单文件上限未推送时是否通知频道属主
      ## （超限视频降级纯文本的专属通知 + 下载告警中的超限跳过条目）。
      ## false 时只写日志，不发送超限告警；其他下载失败通知不受影响。
      ## Default true; notify the channel owner when media exceeds the per-file
      ## limit and is not pushed (oversized-video notice plus oversized skip
      ## entries in the media warning notice). false logs only; other download
      ## failure notices are unaffected.
      # NOTIFY_OVERSIZED_MEDIA: "true"

      ## 默认 10 / Default 10
      # MEDIA_MAX_SIZE_GB: "10"

      ## ===== 图片中转（默认关闭：BASE_URL 为空或不匹配 DOMAINS 即不生效）=====
      ## ===== Image relay (off unless BASE_URL is non-empty AND a domain matches) =====

      ## 默认空；自建反代地址（如 Cloudflare Worker）
      ## Empty; self-hosted reverse proxy URL (e.g. Cloudflare Worker)
      # IMG_RELAY_BASE_URL: ""

      ## 默认空；走中转的域名（逗号分隔）
      ## Empty; domains routed through the relay (comma-separated)
      # IMG_RELAY_DOMAINS: ""

      ## ===== 订阅配额 / Subscription limits =====

      ## 每频道订阅数上限（0=不限）
      ## Subscriptions per channel (0 = unlimited)
      # MAX_SUBSCRIPTIONS_PER_CHAT: "99"

      ## 非管理员每用户总订阅上限（0=不限）
      ## Non-admin total subscriptions per user (0 = unlimited)
      # MAX_SUBSCRIPTIONS_PER_USER: "300"

      ## 非管理员平台源订阅上限（0=不限）
      ## Non-admin platform-source subscriptions (0 = unlimited)
      # MAX_PLATFORM_SUBSCRIPTIONS_PER_USER: "20"

      ## ===== 调度与失败处理 / Scheduling & failure handling =====

      ## 默认 20；连续失败停源阈值
      ## Default 20; consecutive-failure threshold to pause a source
      # MAX_FETCH_ERRORS: "20"

      ## ===== 清理与保留 / Cleanup & retention =====

      ## 默认 30 / Default 30
      # LOG_RETENTION_DAYS: "30"

      ## 默认 7；每日 WAL checkpoint 快照保留天数
      ## Default 7; daily WAL checkpoint snapshot retention
      # BACKUP_RETENTION_DAYS: "7"

      ## ===== 日志 / Logging =====

      ## 默认 info（tracing EnvFilter 语法）
      ## Default info (tracing EnvFilter syntax)
      # RUST_LOG: "info"
    volumes:
      - ./data:/app/data
      ## 媒体目录（单容器部署用本地目录即可）
      ## Media directory (a local directory is fine for single-container deployments)
      - ./media:/app/media
      ## 仅当部署本地 telegram-bot-api 时：把上面 ./media 换成与 bot-api 共享的宿主目录，
      ## 并设置 BOT_API_URL 与 BOT_API_MEDIA_DIR。bot-api 容器需把同一宿主目录挂到
      ## BOT_API_MEDIA_DIR（富消息图片/视频附件由 bot-api 服务器 file:// 直读）；标准发送
      ## 由本进程从 /app/media 流式上传，本容器无需挂载 BOT_API_MEDIA_DIR。例如：
      ## Only when deploying a local telegram-bot-api: replace ./media above with a host
      ## directory shared with bot-api and set BOT_API_URL / BOT_API_MEDIA_DIR. The bot-api
      ## container must mount that host directory at BOT_API_MEDIA_DIR (rich-message photo/video
      ## attachments are read server-side via file://); standard sends stream from /app/media,
      ## so this container does not need to mount BOT_API_MEDIA_DIR. Example:
      # - ../telegram-bot-api/media:/app/media
      - ./logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
