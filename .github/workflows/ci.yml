name: CI

on:
  push:
    branches: ["*"]
  pull_request:

# Least privilege: default the GITHUB_TOKEN to read-only repo contents.
# No job here needs to write anything back to the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No tracked file is meant to be executable; a stray 100755 mode usually
      # comes from copying files through a Windows/WSL filesystem.
      - name: Check tracked file modes
        run: |
          bad=$(git ls-files -s | awk '$1 == "100755" { print $4 }')
          if [ -n "$bad" ]; then
            echo "::error::Tracked files must not have the executable bit:"
            echo "$bad"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked -- -D warnings
      - name: Test
        run: cargo test --locked
